name: Dacky total finalization
on:
  push:
    branches: [integration/dacky-total-finalization]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DackyMobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: node --test tests/combat-squad-d2.test.js
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dacky-integration-web
          path: DackyMobile/dist/
