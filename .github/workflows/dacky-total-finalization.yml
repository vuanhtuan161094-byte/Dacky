name: Dacky total finalization
on:
  push:
    branches: [integration/dacky-total-finalization]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DackyMobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: node --test tests/combat-squad-d2.test.js
      - run: npm test
      - run: DACKY_COMBAT_PREVIEW=1 npm run build
      - name: Verify actual D2 presentation and capture
        run: |
          mkdir -p qa/total-finalization
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --window-size=1440,900 --dump-dom "file://$PWD/dist/combat-product.html?squadSmoke=1" > qa/total-finalization/dom.html
          grep -q 'data-squad-smoke="PASS"' qa/total-finalization/dom.html
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --window-size=1440,900 --screenshot="$PWD/qa/total-finalization/battle.png" "file://$PWD/dist/combat-product.html?squadSmoke=1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dacky-integration-runtime
          path: DackyMobile/qa/total-finalization/
      - uses: actions/upload-artifact@v4
        with:
          name: dacky-integration-web
          path: DackyMobile/dist/
