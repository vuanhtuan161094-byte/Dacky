name: Dacky ART01 city review
on:
  push:
    branches: [review/dacky-art01-city]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: DackyMobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-art01.txt playwright
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Capture city from actual game
        run: |
          python -m http.server 4173 --directory dist > /tmp/dacky-art01-http.log 2>&1 &
          sleep 2
          CHROME_BIN="$(command -v google-chrome)" python qa/art01-review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dacky-art01-review
          path: DackyMobile/qa/art01-review/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: dacky-art01-web
          path: DackyMobile/dist/

  publish-review:
    needs: review
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/review/dacky-art01-city'
    permissions:
      contents: write
      actions: read
    concurrency:
      group: dacky-art01-preview-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy/dacky-one-game-v1
      - uses: actions/download-artifact@v4
        with:
          name: dacky-art01-web
          path: ${{ runner.temp }}/art01-dist
      - name: Publish isolated review only
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, shutil, re
          src=pathlib.Path(os.environ['RUNNER_TEMP'])/'art01-dist'
          dst=pathlib.Path('review/art01')
          assert (src/'index.html').is_file() and (src/'assets/art01-city-ground.svg').is_file()
          if dst.exists(): shutil.rmtree(dst)
          dst.mkdir(parents=True)
          for name in ['index.html','styles.css','manifest.webmanifest','sw.js','src','assets']:
              p=src/name
              if p.is_dir(): shutil.copytree(p,dst/name)
              else: shutil.copy2(p,dst/name)
          for name in ['src/store.js','src/main.js']:
              p=dst/name
              p.write_text(p.read_text().replace('dacky-mobile-local','dacky-art01-review-local').replace('dacky-mobile-save-v1','dacky-art01-review-save-v1'))
          p=dst/'sw.js'
          s=re.sub(r"dacky-mobile-shell-[^']+",'dacky-art01-review-shell-'+os.environ['SOURCE_SHA'][:8],p.read_text()).replace("startsWith('dacky-mobile-')","startsWith('dacky-art01-review-')")
          p.write_text(s)
          p=dst/'manifest.webmanifest';data=json.loads(p.read_text());data['name']='Đắc Kỷ · Duyệt thành trì';data['short_name']='Dacky Review';p.write_text(json.dumps(data,ensure_ascii=False))
          (dst/'build.json').write_text(json.dumps({'source':os.environ['SOURCE_SHA'],'ci':int(os.environ['RUN_ID']),'review':'ART01 R5 UX','isolatedSave':True}))
          assert 'dacky-art01-review-local' in (dst/'src/store.js').read_text()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add review/art01
          if git diff --cached --quiet; then echo 'No preview delta'; else git commit -m "deploy: ART01 review ${SOURCE_SHA:0:8}"; git push origin HEAD:deploy/dacky-one-game-v1; fi
