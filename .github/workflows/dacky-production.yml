name: Dacky production branch

on:
  push:
    branches: [feature/dacky-v1-production, integration/dacky-one-game-v1, feature/dacky-product-completion]
  pull_request:
    branches: [feature/dacky-v1-production, integration/dacky-one-game-v1, feature/dacky-product-completion]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dacky-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: DackyMobile
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: DackyMobile/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Android SDK Tools no longer publishes the legacy `tools` package.
          # Install only the command-line tools here; the required platform
          # and build-tools versions are installed by the next step.
          packages: ''

      - name: Install required Android packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run runtime tests
        run: npm test

      - name: Run source parser tests
        run: npm run test:source

      - name: Set up Python build tools
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ART13 image verifier dependency
        run: python -m pip install Pillow==11.3.0

      - name: Build web and offline HTML
        run: |
          npm run build
          if [ -f scripts/gameplay-coverage-p20.mjs ]; then
            node scripts/gameplay-coverage-p20.mjs dist/docs
          fi

      - name: Install browser capture dependencies
        if: github.ref == 'refs/heads/feature/dacky-product-completion'
        run: pip install -r requirements-art01.txt playwright

      - name: Capture actual product runtime screens
        if: github.ref == 'refs/heads/feature/dacky-product-completion'
        run: |
          python -m http.server 4173 --directory dist > /tmp/dacky-product-http.log 2>&1 &
          sleep 2
          CHROME_BIN="$(command -v google-chrome)" python qa/art01-review.py

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK and AAB
        run: ./gradlew --no-daemon assembleDebug bundleDebug
        working-directory: DackyMobile/android

      - name: Upload Web, PWA and offline HTML
        uses: actions/upload-artifact@v4
        with:
          name: dacky-web-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: DackyMobile/dist/

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dacky-debug-apk-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: DackyMobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Android debug AAB
        uses: actions/upload-artifact@v4
        with:
          name: dacky-debug-aab-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: DackyMobile/android/app/build/outputs/bundle/debug/app-debug.aab

      - name: Upload ONE GAME browser evidence
        if: github.ref == 'refs/heads/integration/dacky-one-game-v1'
        uses: actions/upload-artifact@v4
        with:
          name: dacky-browser-evidence-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            DackyMobile/qa/one-game/
            DackyMobile/qa/screenshots-p41-p50-final/
            DackyMobile/qa/screenshots-p41-p50-final-offline/
            DackyMobile/qa/screenshots-visual-remake-after/
            DackyMobile/qa/visual-fidelity-v2/

      - name: Upload product runtime screenshots
        if: github.ref == 'refs/heads/feature/dacky-product-completion'
        uses: actions/upload-artifact@v4
        with:
          name: dacky-product-runtime-captures-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: DackyMobile/qa/art01-review/
