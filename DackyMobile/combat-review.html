<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dacky Combat Review P7</title><style>
*{box-sizing:border-box}body{margin:0;background:#151719;color:#eee4cf;font:16px system-ui}main{max-width:1050px;margin:auto;padding:24px}h1{color:#e5bd69}section{background:#252827;border:1px solid #74613f;padding:16px;margin:12px 0;border-radius:10px}label{display:inline-block;margin:6px}select,input,button{background:#363a38;color:#fff;border:1px solid #9a7b49;padding:8px;border-radius:5px;max-width:100%}button{background:#805529;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}progress{width:100%;height:20px;accent-color:#c69a54}.battle{display:grid;grid-template-columns:1fr 1fr;gap:12px}.log{max-height:350px;overflow:auto}small{color:#e0c49a}@media(max-width:600px){.battle{grid-template-columns:1fr}}
</style><main><h1>Đắc Kỷ — Đấu trường kiểm thử</h1><small>DEV P6/P7 · Dữ liệu nguồn + công thức mô phỏng · Không phải bản phát hành</small><section id="controls"><label>Thần tiên ta <select id="h0"></select></label><label>Thần tiên địch <select id="h1"></select></label><br><label>Quân ta <select id="t0"></select></label><label>Quân địch <select id="t1"></select></label><label>Số quân <input id="count" type="number" min="1" max="100000" value="300"></label><label>Seed <input id="seed" type="number" value="17"></label><br><label>Pháp bảo ta <select id="a0"></select></label><label>Pháp bảo địch <select id="a1"></select></label><button id="run">Bắt đầu trận</button><button id="next" disabled>Hiệp tiếp</button></section><section id="status">Đang tải dữ liệu…</section><div class="battle"><section><h2 id="n0">Quân ta</h2><progress id="p0" max="1" value="1"></progress><p id="s0"></p></section><section><h2 id="n1">Quân địch</h2><progress id="p1" max="1" value="1"></progress><p id="s1"></p></section></div><section><h2>Diễn biến</h2><pre class="log" id="log"></pre></section><section><h2>Pháp thuật chiến lược</h2><select id="spell"></select><button id="cast">Thi triển</button><pre id="world"></pre></section></main><script type="module">
import { MOBILE_SOURCE_DATABASE,TROOPS } from './src/catalog.js';
import { createCombatRuntime } from './src/combat/runtime-v7.js';
import { canEquip } from './src/combat/army-artifacts.js';
import { strategicCatalog,castStrategic } from './src/combat/strategic-v6.js';
const el=id=>document.getElementById(id);
const opts=(id,rows,value)=>{el(id).replaceChildren(...rows.map(([k,v])=>new Option(v,k)));if(value)el(id).value=value;};
const rt=createCombatRuntime({database:MOBILE_SOURCE_DATABASE,troopRows:TROOPS,allowSimulatedLife:true});
const heroes=Object.values(rt.index.heroes),units=Object.values(rt.troops);
for(let i=0;i<2;i++){opts('h'+i,heroes.map(x=>[x.id,x.name]),i?'ba-trung':'na-tra');opts('t'+i,units.map(x=>[x.id,x.name]),units[i]?.id);const load=()=>{const h=rt.index.heroes[el('h'+i).value];opts('a'+i,[['','Không dùng'],...Object.values(rt.index.artifacts).filter(a=>a.status==='MAPPED'&&canEquip(a,h,{level:150}).ok).map(a=>[a.id,a.name])]);};el('h'+i).onchange=load;load();}
let battle,cursor=0,initial=0;
function show(){const round=battle.rounds[cursor++];if(!round)return;
 for(let i=0;i<2;i++){const s=round.sides[i],t=round.tactical[i];el('n'+i).textContent=rt.index.heroes[s.heroId].name;el('p'+i).value=s.troops/initial;el('s'+i).textContent='Binh lực '+s.troops+' · Tinh lực '+s.mana+' · Tương khắc '+(t.counter*100).toFixed(1)+'%';}
 el('log').textContent+='Hiệp '+round.round+'\n'+round.events.map(e=>e.type+' · phe '+(e.side+1)+' · '+(e.name??e.actual??e.amount??e.reason??'')).join('\n')+'\n';
 const done=cursor===battle.rounds.length;el('next').disabled=done;el('status').textContent=done?'Kết quả: '+(battle.winner===null?'Hòa':battle.winner===0?'Ta thắng':'Địch thắng')+' | Tổn thất: '+battle.losses.join(' / '):'Hiệp '+round.round+'/'+battle.rounds.length;
}
el('next').onclick=show;el('run').onclick=()=>{try{initial=Number(el('count').value);if(!Number.isSafeInteger(initial)||initial<1||initial>100000)throw Error('Số quân không hợp lệ');const sides=[0,1].map(i=>{const h=rt.index.heroes[el('h'+i).value],a=el('a'+i).value;return {heroId:h.id,level:150,stacks:[{id:el('t'+i).value,count:initial}],vitality:h.vitality,maxVitality:h.vitality,mana:h.spirit,maxMana:h.spirit,equippedArtifactIds:a?[a]:[],ownedArtifactIds:a?[a]:[]}});battle=rt.army({battleId:'review',sides,seed:Number(el('seed').value)});cursor=0;el('log').textContent='';show();}catch(e){el('status').textContent=e.message;}};
const spells=strategicCatalog().filter(x=>x.rule);opts('spell',spells.map(x=>[x.row.ID,x.row.name]));let world={casters:{h:{cityId:'a',ownerId:'p',energy:3000,spellTier:2}},cities:{a:{ownerId:'p',morale:80,loyalty:80,troops:{a:300}},b:{ownerId:'q',morale:80,loyalty:80,troops:{b:300}}}},seq=0;
el('cast').onclick=()=>{const spellId=Number(el('spell').value),s=spells.find(x=>x.row.ID===spellId),r=castStrategic({world,casterId:'h',targetId:s.rule[0]==='own'?'a':'b',spellId,castId:'review-'+(++seq),now:0});if(r.ok)world=r.world;el('world').textContent=JSON.stringify({ok:r.ok,reason:r.reason,energy:world.casters.h.energy,cities:world.cities,events:r.events},null,2);};
el('status').textContent=heroes.length+' thần tiên · '+units.length+' quân chủng · chọn đội và bắt đầu.';
</script></html>
